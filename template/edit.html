<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            padding: 30px 15px;
        }

        .form-container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h1 {
            color: #1e293b;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .form-title p {
            color: #64748b;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .update-btn {
            background: #2563eb;
            color: white;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        @media (max-width: 700px) {

            .form-container {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .buttons {
                grid-column: auto;
            }
        }

        @media (max-width: 480px) {

            body {
                padding: 15px 10px;
            }

            .form-container {
                padding: 22px 18px;
            }

            .form-title h1 {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="form-container">

    <div class="form-title">
        <h1>Edit Employee</h1>
        <p>Update employee information</p>
    </div>

    <form method="POST">

        {% csrf_token %}

        <div class="form-grid">

            <!-- Employee ID -->
            <div class="form-group">
                <label>Employee ID</label>

                <input
                    type="text"
                    name="employee_id"
                    value="{{ employee.employee_id }}"
                    required
                >
            </div>

            <!-- Name -->
            <div class="form-group">
                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ employee.name }}"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ employee.email }}"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    value="{{ employee.phone }}"
                    maxlength="10"
                    required
                >
            </div>

            <!-- Department -->
            <div class="form-group">
                <label>Department</label>

                <select name="department" required>

                    <option value="">Select Department</option>

                    <option value="IT"
                        {% if employee.department == "IT" %}selected{% endif %}>
                        IT
                    </option>

                    <option value="HR"
                        {% if employee.department == "HR" %}selected{% endif %}>
                        HR
                    </option>

                    <option value="Finance"
                        {% if employee.department == "Finance" %}selected{% endif %}>
                        Finance
                    </option>

                    <option value="Sales"
                        {% if employee.department == "Sales" %}selected{% endif %}>
                        Sales
                    </option>

                    <option value="Marketing"
                        {% if employee.department == "Marketing" %}selected{% endif %}>
                        Marketing
                    </option>

                </select>
            </div>

            <!-- Designation -->
            <div class="form-group">
                <label>Designation</label>

                <input
                    type="text"
                    name="designation"
                    value="{{ employee.designation }}"
                    required
                >
            </div>

            <!-- Salary -->
            <div class="form-group">
                <label>Salary</label>

                <input
                    type="number"
                    name="salary"
                    value="{{ employee.salary }}"
                    min="0"
                    required
                >
            </div>

            <!-- Address -->
            <div class="form-group full-width">
                <label>Address</label>

                <textarea
                    name="address"
                    required
                >{{ employee.address }}</textarea>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button type="submit" class="btn update-btn">
                    Update Employee
                </button>

                <a href="{% url 'view' %}"
                   class="btn cancel-btn">
                    Cancel
                </a>

            </div>

        </div>

    </form>

</div>

</body>
</html>
