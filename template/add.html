<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f5f9;
            padding: 30px 15px;
        }

        .form-container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-title h1 {
            color: #1e293b;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .form-title p {
            color: #64748b;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .reset-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .reset-btn:hover {
            background: #cbd5e1;
        }

        /* Tablet */
        @media (max-width: 700px) {

            .form-container {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .buttons {
                grid-column: auto;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {

            body {
                padding: 15px 10px;
            }

            .form-container {
                padding: 22px 18px;
                border-radius: 12px;
            }

            .form-title h1 {
                font-size: 24px;
            }

            .form-title p {
                font-size: 13px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-title">
            <h1>Add Employee</h1>
            <p>Enter employee details below</p>
        </div>

        <form method="POST" action="{% url 'add' %}"  >

            {% csrf_token %}

            <div class="form-grid">

                <!-- Employee ID -->
                <div class="form-group">
                    <label for="employee_id">Employee ID</label>
                    <input
                        type="text"
                        id="employee_id"
                        name="employee_id"
                        placeholder="Enter employee ID"
                        required
                    >
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        maxlength="10"
                        required
                    >
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" name="department" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Sales">Sales</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>

                <!-- Designation -->
                <div class="form-group">
                    <label for="designation">Designation</label>

                    <input
                        type="text"
                        id="designation"
                        name="designation"
                        placeholder="Enter designation"
                        required
                    >
                </div>

                <!-- Salary -->
                <div class="form-group">
                    <label for="salary">Salary</label>

                    <input
                        type="number"
                        id="salary"
                        name="salary"
                        placeholder="Enter salary"
                        min="0"
                        required
                    >
                </div>

                <!-- Address -->
                <div class="form-group full-width">
                    <label for="address">Address</label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter employee address"
                        required
                    ></textarea>
                </div>

                <!-- Buttons -->
                <div class="buttons">

                    <button type="submit" class="btn submit-btn">
                        Add Employee
                    </button>

                    <a href="{% url 'view' %}" type="reset" class="btn reset-btn">
                        View
                    </a> 
                    

                </div>

            </div>

        </form>

    </div>

</body>
</html>
